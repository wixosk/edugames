name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          # Every tracked file except repo tooling/docs; then stamp the build hash for the update check.
          mkdir _site
          git ls-files | grep -Ev '^(\.github/|\.gitignore$|CLAUDE\.md$|README|.*/\.claude/|\.claude/)' \
            | xargs -I{} cp --parents {} _site/
          v="${GITHUB_SHA::7}"
          find _site -name '*.html' -exec sed -i "s/__BUILD__/$v/g" {} +
          printf '{"v":"%s"}\n' "$v" > _site/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
